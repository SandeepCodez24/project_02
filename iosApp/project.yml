# Generate the Xcode project on a Mac with:  brew install xcodegen && cd iosApp && xcodegen
# (The generated Kharcha.xcodeproj is git-ignored; this file is the source of truth.)
name: Kharcha
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Kharcha:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Kharcha
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kharcha
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"
        # Kotlin targets are iosArm64 + iosSimulatorArm64 (Apple Silicon Macs).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode doesn't load your shell profile: fall back to Android Studio's
          # bundled JDK and the default Android SDK location if they aren't set.
          STUDIO_JBR="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          if [ -z "$JAVA_HOME" ] && [ -d "$STUDIO_JBR" ]; then export JAVA_HOME="$STUDIO_JBR"; fi
          if [ -z "$ANDROID_HOME" ] && [ -d "$HOME/Library/Android/sdk" ]; then export ANDROID_HOME="$HOME/Library/Android/sdk"; fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
