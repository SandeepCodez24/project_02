name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pkharcha.coreOnly=true :core:jvmTest

  android:
    name: Android build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the APK to a draft release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kharcha-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      # Draft releases are visible only to repo collaborators, so the debug APK
      # is downloadable with one link without being published publicly.
      - name: Attach APK to draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/*.apk Kharcha-debug.apk
          TAG="android-debug-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" Kharcha-debug.apk --draft \
            --title "Kharcha debug APK ($GITHUB_REF_NAME)" \
            --notes "Debug build of ${GITHUB_SHA}. Draft release: only visible to repository collaborators." \
            --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests on iOS simulator
        run: ./gradlew :core:iosSimulatorArm64Test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen
      - name: Build app for simulator
        run: |
          cd iosApp
          xcodebuild -project Kharcha.xcodeproj -scheme Kharcha \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
